<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form for Student</title>
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="IMG-20251208-WA0021.jpg">
</head>
<body>
    <header>
        <!-- Inline CSS for circular logo -->
        <img src="IMG-20251208-WA0021.jpg" alt="Website Logo" 
             width="50" height="50" 
             style="border-radius:50%; object-fit:cover;">
    </header>

    <center>
        <h1><b>Welcome back to School !!!!</b></h1>
        <form>
            <ul style="list-style-type: none; padding:0;">
                <li>
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" placeholder="Dharani" required>
                    <br><br>
                </li>
                <li>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="d@2^34#" required>
                    <br><br>
                </li>
                <li>
                    <label for="email">E-mail ID:</label>
                    <input type="email" id="email" name="email" placeholder="XYZ@gmail.com" required>
                    <br><br>
                </li>
                <li>
                    <label for="class">Class:</label>
                    <input type="text" id="class" name="class" placeholder="Enter your class" required>
                    <br><br>
                </li>
                <li>
                    <button type="submit">Submit</button>
                </li>
            </ul>
        </form>
    </center>
</body>
</html>
